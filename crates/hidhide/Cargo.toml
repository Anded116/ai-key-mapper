[package]
name = "hidhide"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper over the HidHide filter driver IOCTL interface (\\\\.\\HidHide)"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
]
