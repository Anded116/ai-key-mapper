[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Controller-to-keyboard/mouse mapping engine: bindings with layers, gyro, flick stick"

[dependencies]
dualsense = { path = "../dualsense" }
hidapi = "2.6.7"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"]

[[bin]]
name = "aikm"
path = "src/bin/aikm.rs"
