extends = "_base"
game = "TestRange"
exe = "testrange.exe"

[calibration]
real_world = 45.4545            # Source-style 0.022°/count
in_game_sens = 1.0

# TestRange switches prompts to whichever device moved last, like many games do. With the
# controller hidden it only ever sees keyboard and mouse: no flicker. Walking then comes from
# the walk ring instead of analog stick speed. profiles/testrange-hybrid.toml is the other way.
[controller]
hide = true

[movement]
mode = "wasd"
walk = "LAlt"

[buttons]
dpad_up = "F"                   # фонарик
dpad_down = "MouseMiddle"       # метка
pad_left = "F1"                 # справка
pad_right = "F2"                # отладочный HUD
mic = "F8"                      # сброс счётчиков
# TestRange держит раскладку меню как в пресете jsm/ — стандарт может меняться
options = "Esc"                 # пауза
create = "Tab"                  # статистика, пока держишь

[layer.r2]
options = "F9"                  # быстрая загрузка
