[package]
name = "aikm-app"
version = "0.1.0"
edition = "2021"
description = "ai-key-mapper: окно со схемой DualSense и миничатом агента"

# Отдельный workspace: корневой Cargo.toml собирает движок и крейты геймпада независимо от UI.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engine = { path = "../../crates/engine" }
dualsense = { path = "../../crates/dualsense" }

[profile.dev.package."*"]
opt-level = 3
